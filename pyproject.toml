[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-intelligence"
version = "0.2.0"
description = "Reference implementation of an OCR + LLM document extraction pipeline with human-review queue."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Darrshan Govender" }]
dependencies = [
    "pydantic>=2.6",
    "pdfplumber>=0.10",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.34"]
openai = ["openai>=1.30"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "reportlab>=4.0",
    "ruff>=0.5",
]

[project.scripts]
doc-intel = "doc_intelligence.cli:main"

[tool.setuptools.packages.find]
include = ["doc_intelligence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
