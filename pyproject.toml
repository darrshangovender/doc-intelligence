[project]
name = "doc-intelligence"
version = "0.2.0"
description = "Reference implementation of an OCR + LLM document extraction pipeline with human-review queue."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Darrshan Govender", email = "darrshangovender@gmail.com" }]
keywords = ["ocr", "llm", "document-extraction", "pdf", "idp", "human-in-the-loop"]
dependencies = [
    "pydantic>=2.6",
    "pdfplumber>=0.10",
    "PyYAML>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
# OCR is opt-in: pytesseract is only a thin binding, and the Tesseract *binary*
# it shells out to is not present on stock CI runners. Keeping it out of the
# core dependency set means an install without it still yields a working
# native-text pipeline instead of a package that imports but cannot run.
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0"]
anthropic = ["anthropic>=0.34"]
openai = ["openai>=1.30"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    # tests/test_pdf_loader.py synthesises PDFs to exercise the loader.
    "reportlab>=4.0",
]

[project.urls]
Homepage = "https://github.com/darrshangovender/doc-intelligence"
Issues = "https://github.com/darrshangovender/doc-intelligence/issues"

[project.scripts]
doc-intel = "doc_intelligence.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doc_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E402 stays on so the deliberate `# noqa: E402` markers in this repo remain
# load-bearing: those imports must follow the sys.path bootstrap above them.
extend-select = ["E402"]
