# Golden expectations for each sample document.
# Run with:  python eval/run_eval.py
#
# `expected` fields are compared by string equality after normalisation. Money
# is compared as Decimal. line_items / items / parties are compared as sets
# of normalised descriptions.

cases:
  - id: invoice_001
    file: demo/sample_docs/invoice_001.txt
    doc_type: invoice
    expected:
      vendor: ACME WIDGETS PTY LTD
      invoice_no: INV-2025-00042
      invoice_date: "2025-03-14"
      due_date: "2025-04-13"
      subtotal: "865.00"
      tax: "129.75"
      total: "994.75"
      line_item_descriptions:
        - Stainless mixing bowl
        - Whisk attachment, large
        - Silicone spatula set

